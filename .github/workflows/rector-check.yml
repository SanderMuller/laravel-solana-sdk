name: rector-check

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - 'rector.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/rector-check.yml'
  pull_request:
    paths:
      - '**.php'
      - 'rector.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/rector-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rector:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, sodium
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - name: Prime rector cache dirs
        run: mkdir -p .cache/rector .cache/rectorContainer

      - run: vendor/bin/rector process --dry-run
